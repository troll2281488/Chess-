<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Doany AI</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 5px; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>
    <h2>Тест Doany AI (HTML)</h2>
    <p>Нажмите кнопку, чтобы отправить тестовый запрос.</p>
    <button id="sendBtn">Отправить запрос</button>
    <h3>Результат:</h3>
    <pre id="result">Ожидание...</pre>

    <script>
        // ⚠️ Внимание: ключ виден всем, кто откроет страницу. Только для локального теста!
        const SITE_TOKEN = 'sk-2925ff9f9657441393bc68e45ae5ba01';
        const GATEWAY_URL = 'https://gw.doany.ai/v1/llm/chat/completions';

        document.getElementById('sendBtn').addEventListener('click', async () => {
            const resultEl = document.getElementById('result');
            resultEl.textContent = 'Отправка запроса...';

            try {
                const response = await fetch(GATEWAY_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SITE_TOKEN}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-5.5',
                        messages: [{ role: 'user', content: 'Привет! Ответь одним коротким предложением.' }]
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                const data = await response.json();
                const reply = data.choices?.[0]?.message?.content || JSON.stringify(data, null, 2);
                resultEl.textContent = `✅ Успех!\n\nОтвет: ${reply}`;
            } catch (error) {
                resultEl.textContent = `❌ Ошибка:\n${error.message}\n\nПодсказка: если ошибка 401 или CORS, значит ключ недействителен, либо шлюз не разрешает прямые запросы из браузера.`;
            }
        });
    </script>
</body>
</html>
